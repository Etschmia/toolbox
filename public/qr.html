<!DOCTYPE html>
<html lang="de">
<head>
<title data-i18n="qr.title">QR erstellen · Toolbox</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design/tokens.css?v=1">
<link rel="stylesheet" href="/style.css?v=3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='10' width='80' height='80' rx='20' fill='%2325a37a'/%3E%3Cpath d='M30 70 60 40M58 30l12 12' stroke='%23fff' stroke-width='9' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<main class="page">
  <h1 data-i18n="nav.qr">QR erstellen</h1>
  <p class="lead" data-i18n="qr.lead">Wird vollständig im Browser erzeugt — die Eingabe verlässt dieses Gerät nicht.</p>

  <div class="qr-layout">
    <div>
      <div class="card">
        <div class="field">
          <label data-i18n="qr.kind">Art</label>
          <div class="segments" id="kind">
            <label><input type="radio" name="kind" value="text" checked><span data-i18n="qr.kindText">Text / URL</span></label>
            <label><input type="radio" name="kind" value="bitcoin">Bitcoin</label>
            <label><input type="radio" name="kind" value="wifi"><span data-i18n="qr.kindWifi">WLAN</span></label>
          </div>
        </div>

        <div id="pane-text">
          <div class="field">
            <label for="text" data-i18n="qr.content">Inhalt</label>
            <textarea id="text" class="mono" rows="4" placeholder="https://… oder beliebiger Text" data-i18n-placeholder="qr.contentPh" autofocus></textarea>
          </div>
        </div>

        <div id="pane-bitcoin" hidden>
          <div class="field">
            <label for="btc-addr" data-i18n="qr.addr">Adresse</label>
            <input type="text" id="btc-addr" class="mono" placeholder="bc1q…" spellcheck="false" autocomplete="off">
          </div>
          <div class="row">
            <div class="field">
              <label for="btc-amount" data-i18n="qr.amount">Betrag (BTC, optional)</label>
              <input type="text" id="btc-amount" class="mono" inputmode="decimal" placeholder="0.001">
            </div>
            <div class="field">
              <label for="btc-label" data-i18n="qr.label">Bezeichnung (optional)</label>
              <input type="text" id="btc-label" placeholder="z. B. Spende" data-i18n-placeholder="qr.labelPh">
            </div>
          </div>
          <p class="hint" style="margin-top:10px" data-i18n-html="qr.bip21">Ergibt einen <span class="mono">bitcoin:</span>-URI (BIP-21), den Wallets direkt öffnen.</p>
        </div>

        <div id="pane-wifi" hidden>
          <div class="row">
            <div class="field">
              <label for="wifi-ssid" data-i18n="qr.ssid">Netzname (SSID)</label>
              <input type="text" id="wifi-ssid" autocomplete="off">
            </div>
            <div class="field">
              <label for="wifi-type" data-i18n="qr.enc">Verschlüsselung</label>
              <select id="wifi-type"><option value="WPA">WPA/WPA2/WPA3</option><option value="WEP">WEP</option><option value="nopass" data-i18n="qr.open">offen</option></select>
            </div>
          </div>
          <div class="field" style="margin-top:12px">
            <label for="wifi-pass" data-i18n="qr.pass">Passwort</label>
            <input type="text" id="wifi-pass" class="mono" autocomplete="off">
          </div>
          <label class="field-inline hint"><input type="checkbox" id="wifi-hidden"> <span data-i18n="qr.hidden">verstecktes Netz</span></label>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="qr.display">Darstellung</h2>
        <div class="row">
          <div class="field">
            <label data-i18n="qr.ecl">Fehlerkorrektur</label>
            <div class="segments" id="ecl">
              <label title="~7 % — kleinster Code" data-i18n-title="qr.eclL"><input type="radio" name="ecl" value="L">L</label>
              <label title="~15 %" data-i18n-title="qr.eclM"><input type="radio" name="ecl" value="M" checked>M</label>
              <label title="~25 %" data-i18n-title="qr.eclQ"><input type="radio" name="ecl" value="Q">Q</label>
              <label title="~30 % — robust, z. B. bei Aufdruck" data-i18n-title="qr.eclH"><input type="radio" name="ecl" value="H">H</label>
            </div>
          </div>
        </div>
        <div class="field" style="margin-top:14px">
          <label for="size" data-i18n="qr.size">Bildgröße (Export)</label>
          <div class="range">
            <input type="range" id="size" min="128" max="2048" step="64" value="512">
            <output id="size-out" class="mono">512 px</output>
          </div>
        </div>
        <div class="field" style="margin-bottom:0">
          <label for="margin" data-i18n="qr.margin">Rand (Module)</label>
          <div class="range">
            <input type="range" id="margin" min="0" max="8" step="1" value="4">
            <output id="margin-out" class="mono">4</output>
          </div>
        </div>
      </div>
    </div>

    <aside class="qr-preview">
      <div class="qr-canvas-wrap"><canvas id="canvas" width="256" height="256" aria-label="QR-Code-Vorschau" data-i18n-aria="qr.preview"></canvas></div>
      <div class="qr-meta" id="meta" data-i18n="qr.empty">Gib etwas ein …</div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-copy-img" disabled data-i18n="qr.copyImg">Bild kopieren</button>
        <button class="btn btn-outline" id="btn-png" disabled>PNG</button>
        <button class="btn btn-outline" id="btn-svg" disabled>SVG</button>
      </div>
      <button class="btn btn-outline" id="btn-copy-text" disabled style="width:100%" data-i18n="qr.copyText">Kodierten Text kopieren</button>
    </aside>
  </div>
</main>
<footer class="foot">tools.martuni.de</footer>
<script src="/lib/qrcode.js"></script>
<script src="/i18n.js?v=1"></script>
<script src="/common.js?v=3"></script>
<script src="/qr.js?v=2"></script>
</body>
</html>
