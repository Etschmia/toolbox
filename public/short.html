<!DOCTYPE html>
<html lang="de">
<head>
<title>Kurzlink · Toolbox</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design/tokens.css?v=1">
<link rel="stylesheet" href="/style.css?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='10' width='80' height='80' rx='20' fill='%2325a37a'/%3E%3Cpath d='M30 70 60 40M58 30l12 12' stroke='%23fff' stroke-width='9' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<main class="page page-narrow">
  <h1>Kurzlink</h1>
  <p class="lead">Lange Adresse → <span class="mono">tools.martuni.de/abc123</span>. Zum Anlegen brauchst du den Schlüssel; Aufrufen kann jeder.</p>

  <form class="card" id="form" autocomplete="off">
    <div class="field">
      <label for="url">Ziel-Adresse</label>
      <input type="url" id="url" class="mono" placeholder="https://…" required autofocus>
    </div>
    <div class="row">
      <div class="field">
        <label for="code">Wunschkürzel (optional)</label>
        <input type="text" id="code" class="mono" placeholder="sonst zufällig, 6 Zeichen" pattern="[A-Za-z0-9_-]{3,32}">
      </div>
      <div class="field">
        <label for="key">Schlüssel</label>
        <input type="password" id="key" class="mono" placeholder="wird in diesem Browser gemerkt">
      </div>
    </div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn btn-primary btn-lg" type="submit" id="btn-create">Kurzlink anlegen</button>
    </div>
    <div class="alert alert-err" id="err" hidden style="margin-top:14px"></div>
  </form>

  <section class="card" id="result" hidden>
    <h2>Kurzlink</h2>
    <div class="result-link">
      <span class="url mono" id="link"></span>
      <button class="btn btn-primary" id="btn-copy" type="button">Kopieren</button>
    </div>
    <p class="hint" style="margin:10px 0 0">→ <span class="mono" id="target"></span></p>
    <div class="btn-row" style="margin-top:16px">
      <a class="btn btn-outline" id="btn-qr" href="#">Als QR-Code</a>
    </div>
  </section>

  <section class="card">
    <h2>Nachschlagen</h2>
    <div class="row">
      <div class="field">
        <label for="lookup">Kürzel</label>
        <input type="text" id="lookup" class="mono" placeholder="abc123">
      </div>
      <button class="btn btn-outline" id="btn-lookup" type="button">Prüfen</button>
    </div>
    <p class="hint" id="lookup-out" style="margin:10px 0 0"></p>
  </section>
</main>
<footer class="foot">tools.martuni.de</footer>
<script src="/common.js?v=2"></script>
<script src="/short.js?v=1"></script>
</body>
</html>
